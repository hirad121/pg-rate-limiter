name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install
        run: pip install -e ".[test]"
      - name: Typecheck
        run: pip install mypy && mypy src
      - name: Lint
        run: pip install ruff && ruff check src test
      - name: Test (sqlite + mocked backends)
        run: pytest test/ --ignore=test/test_postgres_integration.py

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pg_rate_limiter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install
        run: pip install -e ".[test]"
      - name: Test against real Postgres
        env:
          PG_RATE_LIMITER_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pg_rate_limiter_test
        run: pytest test/test_postgres_integration.py
